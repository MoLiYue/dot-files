# Material roles do not form an ANSI palette: for example, tertiary is not
# necessarily green. Harmonize Mocha's semantic ANSI anchors with the wallpaper
# source color so terminal meanings stay correct while the palette still adapts.
color0  {{colors.surface_variant.default.hex}}
color1  {{ "#f38ba8" | to_color | harmonize: {{ colors.source_color.default.hex }} | format: "hex" }}
