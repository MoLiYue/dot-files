# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 2000
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wall.jpg

    blur_passes = 3
    blur_size = 8

    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 时间
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 86
    font_family = JetBrainsMono Nerd Font

    position = 0, 160
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(bac2deff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 85
    halign = center
    valign = center
}

# 用户名
label {
    monitor =
    text =  $USER
    color = rgba(89b4faff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, -40
    halign = center
    valign = center
}

# 密码输入框
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ff)

    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
    hide_input = false

    check_color = rgba(f9e2afff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>Wrong Password</i>

    rounding = 18
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)

    position = 0, -115
    halign = center
    valign = center
}
